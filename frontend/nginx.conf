# =====================================================================================================
# nginx serves the compiled Angular app AND forwards API calls to the Spring Boot container.
# Because the browser only ever talks to this one origin (http://localhost:8093), the API calls are
# same-origin, so no CORS headers are needed in Docker.
# =====================================================================================================
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (JS, CSS, JSON) to cut download size.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Forward the REST API and the Swagger docs to the backend. "backend" is the service name in
    # docker-compose.yml; Docker's internal DNS resolves it to the backend container.
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;                                   # keep the original host
        proxy_set_header X-Real-IP $remote_addr;                       # the browser's IP, for logs
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names (main-ABC123.js), so they can be cached "forever":
    # a new build produces new file names.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: paths such as /books/5/edit are Angular routes, not files on disk. Serve index.html
    # and let the Angular router display the right page. index.html itself must never be cached, or users
    # would keep loading an old build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
